<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ReelStyles smoke test</title>
  <!-- 5 s test film for setup.sh / setup.ps1 `test`: proves Node, HyperFrames, Chrome, ffmpeg and the gsap CDN all work. -->
  <style>
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #14121f; }
    #c { display: block; width: 1280px; height: 720px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>window.__timelines = window.__timelines || {};</script>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
    <canvas id="c" width="1280" height="720"></canvas>
  </div>
  <script>
    // Every frame is a pure function of t (no Math.random, no Date).
    const ctx = document.getElementById('c').getContext('2d');
    const ease = (x) => 1 - (1 - Math.min(1, Math.max(0, x))) ** 3;
    function frame(t) {
      ctx.fillStyle = '#14121f'; ctx.fillRect(0, 0, 1280, 720);
      for (let i = 0; i < 6; i++) {                                     // drifting colour bars
        ctx.fillStyle = ['#ff5a5f', '#ffb400', '#00a699', '#7b61ff', '#ff8a00', '#2ec4b6'][i];
        const x = ((i * 230 + t * 120) % 1500) - 200;
        ctx.fillRect(x, 560 + 18 * Math.sin(t * 2 + i), 160, 160);
      }
      const k = ease(t / 0.8);
      ctx.globalAlpha = k; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.font = 'bold 96px sans-serif'; ctx.fillText('ReelStyles', 640, 300 + 40 * (1 - k));
      ctx.globalAlpha = ease((t - 0.8) / 0.6);
      ctx.font = '40px sans-serif'; ctx.fillText('setup test: rendering works', 640, 380);
      ctx.globalAlpha = 1; ctx.fillStyle = '#ffb400'; ctx.fillRect(240, 440, 800 * (t / 5), 8);
    }
    const st = { t: 0 }, tl = gsap.timeline({ paused: true });
    tl.to(st, { t: 5, duration: 5, ease: 'none', onUpdate: () => frame(st.t) });
    frame(0);
    window.__timelines.main = tl;
  </script>
</body>
</html>
