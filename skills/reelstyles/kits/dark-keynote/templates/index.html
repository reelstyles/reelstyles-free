<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>dark keynote film</title>
  <!-- templates/index.html: a 10.4 s demo of the dark-keynote look (16:9, 1920x1080, 30 fps).
       Copy it to the kit root (paths are relative to the kit root) and edit the film script at the bottom. It is inline on purpose: the bundler runs external scripts before the stage exists. -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="engine/dk.css">
  <style>html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #06080D; }</style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>window.__timelines = window.__timelines || {};</script>
  <script src="engine/dk.js"></script>
</head>
<body>
  <!-- data-duration = TOTAL in the film script -->
  <div id="dk-stage" data-composition-id="main" data-start="0" data-duration="10.4" data-width="1920" data-height="1080">
    <!-- sound: add an <audio> clip here, see RENDER.md -->
  </div>
  <script>
/* templates/film.js: "Room to Think" demo for a fictional app, Tidy. 10.4 s.
   Shots: A storm (0-3.4)  B the snap (3.4-6.3)  C the number (6.3-8.4)  D end card (8.4-10.4).
   Native moves used: living element (caret), generated accumulation, snap grid, light reveal, number from glyph noise, put-away. */
(function () {
  var TOTAL = 10.4;
  var X = DK.init({ total: TOTAL, accent: '#7CF5C8', problem: '#FF5C6C' });
  var tl = X.tl, cam = X.cam, rnd = DK.rng(11);

  /* ---------- A: the storm (generated accumulation) ---------- */
  var N = 48, titles = ['Untitled', 'Draft', 'Screenshot', 'Notes', 'Invoice', 'Final v2', 'Copy of', 'Inbox'];
  var cols = ['#7CA8FF', '#FFB454', '#B58CFF', '#5ED6A8', '#FF7DA8', '#8FA0B8'];
  var wins = [], GX0 = 72, GW = 96, GG = 16, ROWY = [330, 530, 730];
  for (var i = 0; i < N; i++) {
    var w = 300 + Math.round(rnd() * 70), h = 190 + Math.round(rnd() * 40);
    var cat = i % 3;
    var win = DK.win(cam, { w: w, h: h, x: -140 + rnd() * 1760, y: -130 + rnd() * 880, title: titles[Math.floor(rnd() * titles.length)] + ' ' + (3 + i), color: cols[(i * 5 + cat) % cols.length],
      badge: rnd() < 0.55 ? (rnd() < 0.5 ? '9+' : String(2 + Math.floor(rnd() * 90))) : null, lines: [0.8, 0.55, 0.7] });
    win._cat = cat; win._i = i; win._w = w; win._h = h;
    win.style.zIndex = 10 + i;
    wins.push(win);
    var ts = 0.35 + 2.55 * Math.pow(i / N, 1.7), sx = gsap.getProperty(win, 'x'), sy = gsap.getProperty(win, 'y');
    var rot = (rnd() - 0.5) * 12;
    tl.fromTo(win, { opacity: 0, scale: 0.55, y: sy - 50, rotation: rot * 2 }, { opacity: 1, scale: 1, y: sy, rotation: rot, duration: 0.28, ease: 'back.out(1.7)', immediateRender: true }, ts);
    // tension: a tremble on the inner card until the snap
    tl.fromTo(win._ci, { x: 0, y: 0, rotation: 0 }, { x: 3 + rnd() * 3, y: -2 - rnd() * 3, rotation: 0.5, duration: 0.09, yoyo: true, repeat: Math.floor((4.3 - ts) / 0.09), ease: 'sine.inOut', immediateRender: false }, ts + 0.28);
  }
  // protagonist: the caret, alive from frame 0 and on top of the pile
  var caret = DK.el(cam, 'dk-caret', null, { width: '12px', height: '104px', left: '954px', top: '470px', zIndex: 400, opacity: 0 });
  tl.fromTo(caret, { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.2, ease: 'back.out(2)' }, 0.05);
  DK.blink(tl, caret, 0.3, 3.7, 0.4);
  DK.alive(tl, caret, 0.3, 3.7, { y: 6, period: 0.7 });
  DK.camera(tl, 0, 3.4, { s0: 1.22, s1: 0.94, ease: 'power2.out' });
  DK.toast(tl, 'Your screen is buried.', 1.0, 3.3);

  /* ---------- B: the snap ---------- */
  var btn = DK.el(cam, 'dk-pill acc', 'Tidy up', { left: '812px', top: '716px', width: '296px', zIndex: 600, justifyContent: 'center', opacity: 0 });
  gsap.set(btn, { transformOrigin: '50% 50%' });
  tl.fromTo(btn, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(1.8)', immediateRender: false }, 3.45);
  DK.alive(tl, btn, 3.8, 4.3, { y: 5, period: 0.5 });
  // the caret turns into a pointer that flies to the button on a curved path (x and y use different eases)
  var ptr = DK.el(cam, '', '<svg viewBox="0 0 40 52" width="64" height="83"><path d="M4 2v40l11-10 8 18 8-4-8-17h15z" fill="#F2F5FA" stroke="#06080D" stroke-width="3" stroke-linejoin="round"/></svg>', { position: 'absolute', left: '0', top: '0', zIndex: 700, opacity: 0, filter: 'drop-shadow(0 6px 14px rgba(0,0,0,.6))' });
  gsap.set(ptr, { x: 960, y: 470, transformOrigin: '6px 4px' });
  tl.set(caret, { opacity: 0 }, 3.62);
  tl.fromTo(ptr, { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, 3.58);
  tl.to(ptr, { x: 930, duration: 0.7, ease: 'power2.out' }, 3.62);
  tl.to(ptr, { y: 742, duration: 0.7, ease: 'power3.inOut' }, 3.62);
  // click: press, ripple, release
  tl.to(btn, { scale: 0.93, duration: 0.07, ease: 'power2.in' }, 4.32);
  tl.to(ptr, { scale: 0.88, duration: 0.07 }, 4.32);
  tl.to(btn, { scale: 1.0, duration: 0.22, ease: 'back.out(3)' }, 4.39);
  tl.to(ptr, { scale: 1, duration: 0.2, ease: 'back.out(3)' }, 4.39);
  var rip = DK.el(cam, '', null, { position: 'absolute', left: '910px', top: '716px', width: '196px', height: '88px', borderRadius: '44px', border: '3px solid var(--accent)', zIndex: 590, opacity: 0 });
  tl.fromTo(rip, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.6, duration: 0.6, ease: 'power2.out', immediateRender: false }, 4.32);
  gsap.set(rip, { transformOrigin: '50% 50%', left: '812px', width: '296px' });
  DK.toast(tl, 'One click.', 3.7, 5.0);
  // everything flies to its typed row (curved flights, staggered); morph the card into a tile
  var SNAP = 4.34;
  wins.forEach(function (win, i) {
    var cat = win._cat, idx = Math.floor(i / 3);                 // 16 per row
    var tx = GX0 + idx * (GW + GG), ty = ROWY[cat];
    var cx = gsap.getProperty(win, 'x'), cy = gsap.getProperty(win, 'y'), t0 = SNAP + i * 0.012, d = 0.62;
    var cw = win._w, ch = win._h;
    tl.to(win, { x: tx - (cw - GW) / 2 * 0 , duration: d, ease: 'power2.out', overwrite: false }, t0);
    tl.to(win, { y: ty, duration: d, ease: 'power3.inOut' }, t0);
    tl.to(win, { rotation: 0, duration: d, ease: 'power2.out' }, t0);
    tl.to(win, { width: GW, height: GW, duration: d * 0.8, ease: 'power3.inOut' }, t0);
    tl.to(win._cont, { opacity: 0, duration: 0.18, ease: 'power1.in' }, t0);
    tl.to(win._ic, { opacity: 1, duration: 0.25 }, t0 + 0.25);
    tl.to(win._ci, { borderRadius: 22, duration: d * 0.8 }, t0);
    tl.set(win, { zIndex: 5 }, t0 + d);
    // landing: tiny squash then dim until the light reaches it
    tl.fromTo(win._ci, { scaleY: 1 }, { scaleY: 0.9, duration: 0.07, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, t0 + d - 0.02);
  });
  // card position is the top-left of its box: x/y above are the tile top-left already (width/height shrink toward it)
  DK.camera(tl, 3.4, 6.3, { s0: 0.94, s1: 1.04, y1: 0, ease: 'sine.inOut' });
  // buttons retract (put-away): squash into a dot
  tl.to(btn, { width: 88, scale: 0.4, opacity: 0, duration: 0.3, ease: 'power3.in' }, 4.7);
  tl.to(ptr, { opacity: 0, scale: 0.4, duration: 0.25, ease: 'power2.in' }, 4.75);
  // rows get labels, built one by one
  var lbl = ['Desktop', 'Photos', 'Inbox'], cnt = ['8,212', '3,704', '492'], rowEls = [];
  for (var r = 0; r < 3; r++) {
    var L = DK.el(cam, 'dk-label', lbl[r] + '  <b>' + cnt[r] + '</b>', { left: GX0 + 'px', top: (ROWY[r] - 62) + 'px', zIndex: 20, opacity: 0 });
    rowEls.push(L);
    tl.fromTo(L, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, 5.15 + r * 0.14);
    DK.alive(tl, L, 5.5 + r * 0.14, 6.25, { x: 6, period: 0.4 });
  }
  // light reveal: a soft band sweeps across and tiles turn on as it passes
  var sw = DK.el(cam, 'dk-sweep', null, { left: '0px', top: '270px', width: '420px', height: '620px', zIndex: 30, opacity: 0 });
  tl.set(sw, { opacity: 1 }, 5.35);
  tl.fromTo(sw, { x: -460, skewX: -12 }, { x: 1960, duration: 1.0, ease: 'power1.inOut', immediateRender: false }, 5.35);
  tl.set(sw, { opacity: 0 }, 6.4);
  wins.forEach(function (win, i) {
    var idx = Math.floor(i / 3), tx = GX0 + idx * (GW + GG);
    tl.fromTo(win._ci, { filter: 'brightness(0.45)' }, { filter: 'brightness(1)', duration: 0.3, ease: 'power2.out', immediateRender: false }, 5.35 + (tx / 1960) * 0.95 + 0.05);
    // idle breathing on the tiles, staggered along the row, keeps the grid alive until the collapse
    tl.to(win._ci, { y: '-=5', duration: 0.5, yoyo: true, repeat: 3, ease: 'sine.inOut', immediateRender: false }, 5.4 + (i % 16) * 0.025);
  });

  /* ---------- C: the number ---------- */
  // CRT-off: the grid squashes into a line, then a point
  var all = wins.concat(rowEls);
  var wrap = X.hud; // tiles live in cam; collapse them directly
  all.forEach(function (e) {
    tl.to(e, { scaleY: 0.02, duration: 0.2, ease: 'power3.in', transformOrigin: '50% 50%' }, 6.15);
  });
  var dot = DK.el(cam, '', null, { position: 'absolute', left: '930px', top: '510px', width: '60px', height: '60px', borderRadius: '50%', background: 'var(--accent)', boxShadow: '0 0 60px rgba(var(--accent-rgb),.9)', zIndex: 800, opacity: 0 });
  tl.fromTo(dot, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'back.out(2.5)', immediateRender: false }, 6.25);
  tl.to(all, { opacity: 0, duration: 0.12, ease: 'power1.in' }, 6.35);
  // the dot expands into the number stage
  var num = DK.el(cam, 'dk-num', '0.8<small>s</small>', { left: '0', top: '0', width: '1920px', textAlign: 'center', zIndex: 300, opacity: 0, transformOrigin: '50% 50%' });
  gsap.set(num, { y: 190 });
  tl.to(dot, { scale: 40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 6.5);
  tl.fromTo(num, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, 6.62);
  tl.to(num, { scale: 1.07, duration: 1.8, ease: 'sine.inOut' }, 6.92);
  DK.scramble(tl, num, 6.62, [6.95, 7.12, 7.29], ['0', '.', '8'], { fmt: function (c) { return c.join('') + '<small>s</small>'; } });
  tl.fromTo(X.glow, { scale: 1 }, { scale: 1.6, duration: 2, ease: 'sine.inOut', immediateRender: false }, 6.4);
  var cap = DK.el(cam, 'dk-label', '<b>12,408</b> files sorted', { left: '0', top: '160px', width: '1920px', textAlign: 'center', zIndex: 310, opacity: 0 });
  tl.fromTo(cap, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, 7.4);
  DK.alive(tl, cap, 7.7, 8.3, { y: 6, period: 0.6 });
  DK.camera(tl, 6.3, 8.5, { s0: 1.0, s1: 1.1, ease: 'power1.inOut' });
  // number is its own message: no toast over it

  /* ---------- D: end card ---------- */
  tl.to([num, cap], { opacity: 0, scale: '+=0.12', duration: 0.25, ease: 'power2.in' }, 8.3);
  var chars = 'Tidy'.split(''), logo = DK.el(cam, 'dk-h1', '', { left: '0', top: '330px', width: '1920px', textAlign: 'center', fontSize: '300px', zIndex: 300 });
  var spans = chars.map(function (c) { var s = document.createElement('span'); s.textContent = c; s.style.display = 'inline-block'; logo.appendChild(s); return s; });
  tl.fromTo(spans, { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.09, ease: 'back.out(1.6)', immediateRender: false }, 8.5);
  gsap.set(spans, { opacity: 0 });
  var caret2 = DK.el(cam, 'dk-caret', null, { width: '16px', height: '260px', left: '1306px', top: '350px', zIndex: 310, opacity: 0 });
  tl.fromTo(caret2, { opacity: 0 }, { opacity: 1, duration: 0.05, immediateRender: false }, 8.95);
  DK.blink(tl, caret2, 8.95, 10.4, 0.4);
  var tag = DK.el(cam, 'dk-label', 'Room to <b>think</b>', { left: '0', top: '680px', width: '1920px', textAlign: 'center', zIndex: 310, opacity: 0, fontSize: '40px' });
  tl.fromTo(tag, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, 9.1);
  DK.alive(tl, [logo, tag], 9.0, 10.4, { y: 6, period: 0.7 });
  DK.camera(tl, 8.3, 10.4, { s0: 0.96, s1: 1.06, ease: 'power1.inOut' });

  window.__timelines['main'] = tl;
  var fix = function () { DK.audit(); };
  fix(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fix);
})();
  </script>
</body>
</html>
