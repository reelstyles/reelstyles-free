<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>doodle film</title>
  <style>
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("fonts/Caveat.ttf") format("truetype"); }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4EEDF; }
    #c { display: block; width: 1920px; height: 1080px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>window.__timelines = window.__timelines || {};   // HyperFrames lint wants the registry declared in the page</script>
</head>
<body>
  <!-- data-duration must equal DUR in film.js -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
    <canvas id="c" width="1920" height="1080"></canvas>
    <audio id="score" class="clip" data-start="0" data-duration="10" data-track-index="0" src="audio/score.wav" data-volume="1"></audio>
  </div>
  <script src="engine/runtime.js"></script>
  <script src="engine/doodle.js"></script>
  <script src="characters/pip.js"></script>
  <script src="sets/sets.js"></script>
  <script src="film.js"></script>
</body>
</html>
