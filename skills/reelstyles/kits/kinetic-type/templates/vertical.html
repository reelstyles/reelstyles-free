<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kinetic type film (9:16)</title>
  <style>
    @font-face { font-family: "Archivo Black"; font-weight: 400 900; font-display: block; src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype"); }
    @font-face { font-family: "Inter"; font-weight: 800; font-display: block; src: url("fonts/Inter-800.woff2") format("woff2"); }

    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0C0B16; }
    #c { display: block; width: 1080px; height: 1920px; }
  </style>

<body>

    <canvas id="c" width="1080" height="1920"></canvas>
    <!-- sound: add an <audio> clip here, see RENDER.md -->
  </div>
  <script>window.FRAME_W = 1080; window.FRAME_H = 1920;</script>
  <script src="engine/runtime.js"></script>
  <script src="engine/safe.js"></script>   <!-- vertical layout guard: label band, end card, layout QA (tools/layout-check.mjs) -->
  <script src="engine/kinetic.js"></script>
  <script src="characters/cast.js"></script>   <!-- the hero: the word block (Hero) -->
  <script src="film.js"></script>
</body>
</html>
